# StackHost deploys one Node service per manifest. The API also serves the
# Angular production bundle, so the app and API share one origin.
name: exercise-tracker
runtime:
  image: node:24
commands:
  package: ''
  build:
    - npm ci
    - npx nx build shared-types
    - npx nx build web --configuration=production
    - npx nx build api --configuration=production
  start: npx nx run api:db-migrate && npx nx run api:db-seed && node apps/api/dist/main.js
port: 3000
# Add these in the StackHost environment settings:
# NODE_ENV=production, API_PORT=3000, and WEB_DIST_PATH=dist/apps/web/browser.
# DATABASE_URL: PostgreSQL connection string from a managed/external database.
# JWT_ACCESS_SECRET and JWT_REFRESH_SECRET: unique, long random secrets.
# CORS_ORIGIN: the public origin of this app.
# OAuth credentials/callback URLs are optional.
