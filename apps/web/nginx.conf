server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Reverse-proxy `/api/v1/*` to the API container so the SPA's relative
  # `apiBaseUrl: '/api/v1'` works unchanged in production, exactly like
  # `apps/web/proxy.conf.json` does for `nx serve web` in development.
  location /api/v1/ {
    proxy_pass http://api:3000/api/v1/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # The service worker's own bookkeeping files must always be revalidated so
  # updates are picked up promptly; hashed build assets are immutable.
  location = /ngsw.json {
    add_header Cache-Control "no-cache";
  }

  location = /ngsw-worker.js {
    add_header Cache-Control "no-cache";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location ~* \.(?:js|css|woff2?)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Client-side routing fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
