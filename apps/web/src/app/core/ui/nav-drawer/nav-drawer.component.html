<div class="drawer">
  <div class="drawer-header">
    <mat-icon aria-hidden="true">account_circle</mat-icon>
    <span class="drawer-header-name" [title]="displayName()">{{ displayName() }}</span>
  </div>

  <mat-divider></mat-divider>

  <mat-nav-list>
    <a
      mat-list-item
      routerLink="/today"
      routerLinkActive="active"
      (click)="navigate.emit()"
    >
      <mat-icon matListItemIcon aria-hidden="true">today</mat-icon>
      <span matListItemTitle>Today</span>
    </a>
    <a
      mat-list-item
      routerLink="/exercises"
      routerLinkActive="active"
      (click)="navigate.emit()"
    >
      <mat-icon matListItemIcon aria-hidden="true">fitness_center</mat-icon>
      <span matListItemTitle>Exercises</span>
    </a>
    <a
      mat-list-item
      routerLink="/stats"
      routerLinkActive="active"
      (click)="navigate.emit()"
    >
      <mat-icon matListItemIcon aria-hidden="true">bar_chart</mat-icon>
      <span matListItemTitle>Stats</span>
    </a>
  </mat-nav-list>

  <mat-divider></mat-divider>

  <mat-nav-list>
    <button mat-list-item type="button" (click)="toggleTheme()">
      <mat-icon matListItemIcon aria-hidden="true">{{ themeIcon() }}</mat-icon>
      <span matListItemTitle>Theme: {{ themeLabel() }}</span>
    </button>

    @if (pwaInstall.canInstall()) {
      <button mat-list-item type="button" (click)="install()">
        <mat-icon matListItemIcon aria-hidden="true">install_mobile</mat-icon>
        <span matListItemTitle>Install app</span>
      </button>
    }
  </mat-nav-list>

  <mat-divider></mat-divider>

  <mat-nav-list>
    <button mat-list-item type="button" (click)="logout()">
      <mat-icon matListItemIcon aria-hidden="true">logout</mat-icon>
      <span matListItemTitle>Log out</span>
    </button>
  </mat-nav-list>

  <div class="drawer-about">
    <span>Exercise Tracker v{{ appVersion }}</span>
  </div>
</div>
