name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test and build
    runs-on: ubuntu-latest

    # Dummy credentials: the DB-backed e2e suites run against the service
    # container below, never against a real environment.
    env:
      NODE_ENV: test
      API_PORT: '3000'
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/exercise_tracker
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 30d
      CORS_ORIGIN: http://localhost:4200

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: exercise_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history keeps `nx affected` usable for local/manual runs.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npx nx run api:db-migrate

      - name: Seed baseline exercises
        run: npx nx run api:db-seed

      - name: Lint and build
        run: npx nx run-many -t lint build --projects=api,shared-types

      - name: Test shared-types
        run: npx nx test shared-types

      - name: Test API with coverage
        run: npx nx test api --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: apps/api/test-output/jest/coverage
          if-no-files-found: ignore
